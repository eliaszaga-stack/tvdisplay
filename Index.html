<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a; /* Clean dark slate background */
            color: #f8fafc; /* Bright crisp text */
            height: 100vh;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 2rem;
            overflow: hidden;
        }
        .metric-card {
            text-align: center;
            flex: 1;
        }
        .label {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #94a3b8; /* Subdued label color */
            margin-bottom: 1rem;
            font-weight: 600;
        }
        .value {
            font-size: 10rem; /* Huge numbers for TV viewing */
            font-weight: 800;
            color: #38bdf8; /* Sharp sky blue color for the numbers */
        }
        .error {
            font-size: 2rem;
            color: #ef4444;
        }
    </style>
</head>
<body>

    <!-- CARD 1 -->
    <div class="metric-card">
        <div class="label">Sales</div>
        <div id="metric1" class="value">--</div>
    </div>

    <!-- CARD 2 -->
    <div class="metric-card">
        <div class="label">Progress</div>
        <div id="metric2" class="value">--</div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS1rD_EsgEZXS2pJVjsP2DOWTwtuS4EWbTwCvqx2wsyWPebk2MAQZBDrOEQI8CWFfd1vf4Po6VG5WpA/pub?gid=681098728&single=true&output=csv';

        async function updateDashboard() {
            try {
                // Add timestamp to prevent the TV browser from showing old cached numbers
                const freshUrl = csvUrl + '&t=' + new Date().getTime();
                const response = await fetch(freshUrl);
                const data = await response.text();
                
                // Safely extract all cells even if numbers contain commas (e.g., "1,250")
                const values = [];
                const rows = data.trim().split(/\r?\n/);
                
                for (let row of rows) {
                    // Match CSV cells properly, respecting quotes around formatted numbers
                    const matches = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                    if (matches) {
                        for (let cell of matches) {
                            values.push(cell.replace(/^"|"$/g, '').trim());
                        }
                    }
                }

                // Display the first two values found anywhere at the top of the sheet
                if (values[0] !== undefined) document.getElementById('metric1').innerText = values[0];
                if (values[1] !== undefined) document.getElementById('metric2').innerText = values[1];
                
            } catch (error) {
                console.error("Error fetching sheet data:", error);
                document.getElementById('metric1').innerText = "Err";
            }
        }

        // Run immediately when page loads
        updateDashboard();

        // Check for updates automatically every 1 hour
        setInterval(updateDashboard, 3600000);
    </script>

</body>
</html>
