<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            padding: 2rem;
            overflow: hidden;
        }
        .metric-card { text-align: center; }
        .label {
            font-size: clamp(1.2rem, 4vh, 2.5rem);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #94a3b8;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .value {
            font-size: clamp(3rem, min(15vw, 22vh), 12rem);
            font-weight: 800;
            color: #38bdf8;
            white-space: nowrap;
            line-height: 1;
        }
        .value.negative { color: #f87171; }
        .value.positive { color: #4ade80; }
    </style>
</head>
<body>
    <div class="metric-card">
        <div class="label">Sales</div>
        <div id="metric1" class="value">--</div>
    </div>
    <div class="metric-card">
        <div class="label">Progress</div>
        <div id="metric2" class="value">--</div>
    </div>
    <script>
        const SHEET_ID = '1ShhD9LRDOD1eTgtiv9rCNWT2_9IX_rzivTwDOqp0oEM';
        const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sales&range=A1:B1&headers=0`;

        async function updateDashboard() {
            try {
                const response = await fetch(csvUrl + '&t=' + Date.now(), { cache: 'no-store' });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const text = await response.text();
                const cols = [...text.matchAll(/"([^"]*)"/g)].map(m => m[1].trim());
                if (cols.length < 2) throw new Error('Sin datos');

                document.getElementById('metric1').innerText = cols[0];
                const m2 = document.getElementById('metric2');
                m2.innerText = cols[1];
                const num = parseFloat(cols[1].replace(/[^0-9.\-]/g, ''));
                m2.classList.toggle('negative', num < 0);
                m2.classList.toggle('positive', num > 0);
            } catch (error) {
                console.error(error);
                document.getElementById('metric1').innerText = 'Err';
                document.getElementById('metric2').innerText = 'Err';
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 5 * 60 * 1000);
    </script>
</body>
</html>
