<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 2rem;
            overflow: hidden;
        }
        .metric-card {
            text-align: center;
            flex: 1;
        }
        .label {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #94a3b8;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        .value {
            font-size: 10rem;
            font-weight: 800;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="metric-card">
        <div class="label">Sales</div>
        <div id="metric1" class="value">--</div>
    </div>

    <div class="metric-card">
        <div class="label">Progress</div>
        <div id="metric2" class="value">--</div>
    </div>

    <script>
        const csvUrl = 'https://google.com';

        async function updateDashboard() {
            try {
                const freshUrl = csvUrl + '&t=' + Date.now();
                const response = await fetch(freshUrl);
                const text = await response.text();
                
                // Split by rows, then split cells cleanly while keeping "$1,500" or "85%" intact
                const foundValues = [];
                const lines = text.split(/\r?\n/);

                for (const line of lines) {
                    // Split on commas ONLY if they are outside of quotation marks
                    const cells = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    for (const cell of cells) {
                        const clean = cell.replace(/^"|"$/g, '').trim();
                        if (clean !== '') {
                            foundValues.push(clean);
                        }
                    }
                }

                // Display the first two non-empty cells found in the sheet
                if (foundValues.length > 0) {
                    document.getElementById('metric1').innerText = foundValues[0];
                }
                if (foundValues.length > 1) {
                    document.getElementById('metric2').innerText = foundValues[1];
                }
                
            } catch (error) {
                console.error("Error fetching sheet data:", error);
                document.getElementById('metric1').innerText = "Err";
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 3600000);
    </script>
</body>
</html>
